[project]
name = "mallorn"
version = "0.1.0"
description = ""
authors = [
    { name = "Nguyễn Tư Đức", email = "23021534@gmail.com" },
    { name = "Phạm Trung Hiếu", email = "23021554@vnu.edu.vn "}
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
autogluon = "^1.4.0"
xgboost = "<3.1"
lightgbm = "^4.6.0"
catboost = "^1.2.8"
numpy = "<2.3.0"
pandas = "^2.3.3"
scikit-learn = "^1.7.2"

[tool.poetry.dependencies.kaggle]
git = "https://github.com/NTDuck/kaggle-api.git"
rev = "fe304755f030d45676fd22eb686d37065abadada"

[tool.poetry.group.dev.dependencies]
python-dotenv = ">=1.2.1,<2.0.0"

[tool.poetry.scripts]
kaggle-download = "scripts.kaggle:download"
autogluon = "mallorn.autogluon:main"
